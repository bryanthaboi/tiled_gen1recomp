name: Update Homebrew Cask

# Upstream workflow, disabled in this fork: .github/workflows/release.yml is
# the only thing that runs per commit here. Kept intact (minus its triggers)
# so merges from mapeditor/tiled stay clean; run it by hand if you need it.
on:
  workflow_dispatch:

jobs:
  bump-cask:
    name: Bump Homebrew cask
    runs-on: macos-latest

    # Disabled: Homebrew's BrewTestBot now autobumps the tiled cask on a
    # ~3-hour cadence, and `brew bump-cask-pr` refuses to run manually
    # against autobumped casks. Flip back to the github.repository check
    # if BrewTestBot ever stops handling it.
    if: false

    steps:
      - name: Update Homebrew cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            echo "Error: '$VERSION' is not a valid version. Provide a tag like v1.11.2." && exit 1
          fi
          brew bump-cask-pr --version "$VERSION" --fork-org mapeditor --no-browse tiled
