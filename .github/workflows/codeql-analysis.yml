name: "CodeQL"

# Upstream workflow, disabled in this fork: .github/workflows/release.yml is
# the only thing that runs per commit here. Kept intact (minus its triggers)
# so merges from mapeditor/tiled stay clean; run it by hand if you need it.
on:
  workflow_dispatch:

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # We must fetch at least the immediate parents so that if this is
        # a pull request then we can checkout the head.
        fetch-depth: 2

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: cpp

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install qt6-base-dev libqt6svg6-dev qt6-tools-dev-tools qt6-l10n-tools qt6-declarative-dev libgl-dev zlib1g-dev qbs python3-dev
        sudo update-alternatives --install /usr/bin/qmake qmake /usr/bin/qmake6 100

    - name: Setup qbs
      run: |
        qbs setup-toolchains --detect
        qbs config defaultProfile x86_64-linux-gnu-gcc-12

    - name: Build
      run: qbs build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
