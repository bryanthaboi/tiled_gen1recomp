name: "Build Manual"
# Upstream workflow, disabled in this fork: .github/workflows/release.yml is
# the only thing that runs per commit here. Kept intact (minus its triggers)
# so merges from mapeditor/tiled stay clean; run it by hand if you need it.
on:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Build documentation
      uses: ammaraskar/sphinx-action@8.2.3
      with:
        docs-folder: "docs/"

    - name: Upload documentation
      uses: actions/upload-artifact@v6
      with:
        name: Tiled-Manual-HTML
        path: docs/_build/html/
